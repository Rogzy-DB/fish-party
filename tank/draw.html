<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Draw a fish — Fish Party</title>
<link rel="stylesheet" href="static/ui.css">
<style>
  /* The aquarium is a full-bleed art surface; the phone pages are small apps.
     We take ui.css's tokens and radii but keep the deep-water palette so
     the colorer feels like it belongs to the tank it feeds. */
  :root {
    color-scheme: dark;
    --paper: #041020;
    --card: #0a2038;
    --line: #1d3a5c;
    --ink: #dfe9f5;
    --faint: #8fb0cc;
    --accent: #1573c4;
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font: 16px/1.5 var(--font, system-ui, sans-serif); color: var(--ink);
    background: linear-gradient(#06182e, var(--paper) 70%, #020a14);
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .screen { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .screen.on { display: flex; }

  /* ---------------- screen 1: pick a species ---------------- */
  #pick { overflow-y: auto; padding: 0 var(--sp-3, 14px) var(--sp-5, 28px); }
  /* extends the shared .topbar: the tank's palette is dark, and this page is a
     full-height flex screen so the bar must not shrink. */
  .topbar { background: transparent; border-bottom-color: var(--line); flex: 0 0 auto; }
  .topbar .home { margin-left: auto; }
  p.sub { color: var(--faint); font-size: var(--fs-1, .9rem); margin-bottom: var(--sp-4, 18px); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-3, 12px); }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  .grid button {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius, 14px); padding: 10px 6px 8px;
    color: var(--faint); font-size: .72rem; font-family: inherit; cursor: pointer;
  }
  .grid button:active { border-color: #4d8ec4; }
  .grid button img {
    width: 100%; aspect-ratio: 1; object-fit: contain;
    /* line art is black-on-transparent — invert it so it reads on dark cards */
    filter: invert(1);
  }

  /* ---------------- screen 2: paint ---------------- */
  #paint { padding: 0; }
  .bar {
    display: flex; align-items: center; gap: 10px;
    padding: 8px var(--sp-3, 12px); border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
  }
  .bar .name { font-weight: 600; font-size: var(--fs-1, .95rem); flex: 1; }
  .icon-btn {
    background: var(--card); border: 1px solid var(--line); color: var(--ink);
    border-radius: var(--radius-sm, 10px); min-width: 44px; height: 40px;
    font-size: 1.1rem; font-family: inherit; cursor: pointer;
  }
  .icon-btn:disabled { opacity: .35; }
  .canvas-wrap {
    flex: 1; min-height: 0; position: relative;
    display: flex; align-items: center; justify-content: center;
    padding: 6px;
  }
  /* Two stacked layers: paint BELOW, line art ABOVE, so a stroke can never
     hide the outline the guest is colouring inside. */
  .stack { position: relative; }
  .stack canvas, .stack img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border-radius: var(--radius-sm, 10px);
  }
  #paper { background: #fff; }
  #art { pointer-events: none; }
  .stack { touch-action: none; }
  canvas { touch-action: none; }

  .tools { flex: 0 0 auto; padding: 8px var(--sp-3, 12px) 10px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .swatches button {
    width: 40px; height: 40px; border-radius: 50%; border: 2px solid #ffffff22;
    cursor: pointer; padding: 0;
  }
  .swatches button[aria-pressed="true"] { border-color: #fff; transform: scale(1.14); }
  .sizes { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
  .sizes button {
    flex: 0 0 auto; min-width: 52px; height: 40px; border-radius: var(--radius-sm, 10px);
    background: var(--card); border: 1px solid var(--line); color: var(--ink);
    font-family: inherit; cursor: pointer; display: flex;
    align-items: center; justify-content: center;
  }
  .sizes button[aria-pressed="true"] { border-color: #4d8ec4; background: #123a5e; }
  .sizes .dot { background: currentColor; border-radius: 50%; display: block; }
  .go {
    width: 100%; margin-top: 10px; padding: 15px; font-size: 1.1rem;
    border: 0; border-radius: var(--radius, 12px); background: var(--accent);
    color: #2a1d00; font-weight: 800; font-family: inherit; cursor: pointer;
  }
  .go:disabled { background: #29425c; color: #7d94ab; }
  .namein {
    width: 100%; margin-top: 10px; padding: 12px 14px; font-size: 1rem;
    font-family: inherit; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: var(--radius, 12px);
  }
  .namein::placeholder { color: var(--faint); }
  .namein:focus { outline: none; border-color: #4d8ec4; }

  /* ---------------- screen 3: result ---------------- */
  #done { align-items: center; justify-content: center; text-align: center; gap: 14px; padding: 24px; }
  #done .big { font-size: 3rem; }
  #done .species { font-size: var(--fs-4, 1.5rem); font-weight: 700; }
  #done .msg { color: var(--faint); }
  #done.err .species { color: var(--bad, #e2725b); }
  .links { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
  a.nav, button.nav {
    color: #6fb1e8; font-size: .9rem; background: none; border: 0;
    font-family: inherit; cursor: pointer; text-decoration: none;
  }
  #pick .links { margin-top: var(--sp-5, 26px); }

  /* ---------------- resume-an-unsent-drawing bar ---------------- */
  .resume {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius, 14px); padding: 12px 14px;
    margin-bottom: var(--sp-4, 18px);
  }
  .resume .txt { flex: 1; min-width: 140px; font-size: var(--fs-1, .9rem); }
  .resume .acts { display: flex; gap: 12px; }
</style>
<script>
  // home = your own party (everything open) · public = the shared tank (owner
  // pages behind a password) · showcase = read-only. serve.py fills this in.
  window.TANK_MODE = "TANK_MODE_PLACEHOLDER";
  window.SITE_URL = "SITE_URL_PLACEHOLDER";
  document.documentElement.dataset.mode = window.TANK_MODE;
</script>
<style>
  [data-mode="public"] .owner-only, [data-mode="showcase"] .owner-only,
  [data-mode="showcase"] .guest-only, [data-mode="home"] .site-only { display: none !important; }
</style>
<link rel="stylesheet" href="static/brand.css">
</head>
<body>

<!-- ---------- 1. pick a species ---------- -->
<section class="screen on" id="pick">
  <header id="site-head"></header>
  <div class="topbar">
    <h1>✏️ Draw a fish</h1>
    <a class="home" href="./" title="The tank">🐠</a>
  </div>
  <nav id="tanknav"></nav>
  <div class="resume" id="resumeBar" hidden>
    <span class="txt">🎨 You have an unsent drawing.</span>
    <div class="acts">
      <button class="nav" id="resumeYes" type="button">↩︎ Resume</button>
      <button class="nav" id="resumeNo" type="button">🗑 Start over</button>
    </div>
  </div>
  <p class="sub">Pick a creature, colour it in, and watch it swim.</p>
  <div class="grid" id="grid"></div>
  <div class="links">
    <a class="nav" href="./">🐠 See the tank</a>
  </div>
  <footer id="site-foot"></footer>
</section>

<!-- ---------- 2. paint ---------- -->
<section class="screen" id="paint">
  <div class="bar">
    <button class="icon-btn" id="back" title="Back">‹</button>
    <span class="name" id="pname"></span>
    <button class="icon-btn" id="undo" title="Undo" disabled>↶</button>
    <button class="icon-btn" id="clear" title="Clear all">🗑</button>
  </div>
  <div class="canvas-wrap">
    <div class="stack" id="stack">
      <canvas id="paper"></canvas>
      <img id="art" alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
    </div>
  </div>
  <div class="tools">
    <div class="swatches" id="swatches"></div>
    <div class="sizes" id="sizes"></div>
    <input class="namein" id="fishName" type="text" maxlength="40"
           placeholder="Name your fish (optional)" autocomplete="off">
    <button class="go" id="go">Swim! 🐠</button>
  </div>
</section>

<!-- ---------- 3. result ---------- -->
<section class="screen" id="done">
  <div class="big" id="dicon">🐠</div>
  <div class="species" id="dtitle"></div>
  <div class="msg" id="dmsg"></div>
  <div class="links">
    <button class="nav" id="again">✏️ Draw another</button>
    <a class="nav" href="./">🐠 See the tank</a>
  </div>
</section>

<script>
(() => {
  "use strict";

  // ids match recognizer/species.py ROSTER and static/lineart/<id>.png
  const SPECIES = [
    ["shark", "Shark"], ["whale", "Whale"], ["turtle", "Sea turtle"],
    ["manta_ray", "Manta ray"], ["angelfish", "Angelfish"], ["pufferfish", "Pufferfish"],
    ["jellyfish", "Jellyfish"], ["octopus", "Octopus"], ["squid", "Squid"],
    ["seahorse", "Seahorse"], ["crab", "Crab"], ["sea_urchin", "Sea urchin"],
  ];
  const COLORS = [
    "#ff3b30", "#ff9500", "#ffcc00", "#34c759", "#00c7be", "#32ade6",
    "#0a84ff", "#5e5ce6", "#af52de", "#ff2d92", "#8b5a2b", "#1c1c1e",
  ];
  const SIZES = [10, 26, 52];
  const MAX_UNDO = 12;          // bounded history — a phone canvas is ~1MB/state
  const CANVAS_MAX = 720;       // backing-store long side; also what we POST

  const $ = (id) => document.getElementById(id);
  const screens = { pick: $("pick"), paint: $("paint"), done: $("done") };
  function show(name) {
    for (const k in screens) screens[k].classList.toggle("on", k === name);
  }

  // ---------------- screen 1: the species grid ----------------
  let chosen = null;
  const grid = $("grid");
  for (const [id, label] of SPECIES) {
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = '<img loading="lazy" src="static/lineart/' + id +
                  '.png" alt=""><span>' + label + "</span>";
    b.addEventListener("click", () => { clearDraft(); startPaint(id, label); });
    grid.appendChild(b);
  }

  // ---------------- screen 2: the paint surface ----------------
  const paper = $("paper");        // the paint layer (below)
  const art = $("art");            // the line art (above)
  const stack = $("stack");
  const wrap = document.querySelector(".canvas-wrap");
  const ctx = paper.getContext("2d", { willReadFrequently: false });

  let color = COLORS[0], size = SIZES[1];
  let fillMode = false;           // 🪣: a tap fills the whole zone inside the outline
  let artImg = null;              // the line art at full size: the fill's walls
  let history = [], drawing = false, last = null;

  // ---------------- autosave: don't lose an in-progress drawing ----------------
  // The paint layer is pixels (no stroke list), so the faithful, reconstructable
  // state is the paper canvas itself + which species outline it belongs to + the
  // typed name. We cache that to localStorage as the guest paints (debounced),
  // restore it on load, and clear it the moment a fish is successfully sent so a
  // fresh session starts blank. `dirty` gates saving so a blank canvas is never
  // persisted (which would pop the restore bar for nothing).
  const SAVE_KEY = "fishDraw.autosave.v1";
  let dirty = false, saveTimer = null;
  function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveDraft, 800); }
  function saveDraft() {
    if (!chosen || !dirty) return;
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        v: 1, species: chosen, label: $("pname").textContent,
        name: $("fishName").value || "", png: paper.toDataURL("image/png"), t: Date.now(),
      }));
    } catch (e) { /* private mode / quota — best effort, never break drawing */ }
  }
  function clearDraft() {
    dirty = false; clearTimeout(saveTimer);
    try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ }
  }
  function readDraft() {
    try {
      const d = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
      return (d && d.png && d.species) ? d : null;
    } catch (e) { return null; }
  }

  // palette
  const sw = $("swatches");
  COLORS.forEach((c, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.style.background = c;
    b.setAttribute("aria-pressed", String(i === 0));
    b.setAttribute("aria-label", c);
    b.addEventListener("click", () => {
      color = c;
      [...sw.children].forEach((el) => el.setAttribute("aria-pressed", String(el === b)));
    });
    sw.appendChild(b);
  });
  // brush sizes + eraser
  const sz = $("sizes");
  SIZES.forEach((s, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = '<span class="dot" style="width:' + (6 + i * 6) +
                  "px;height:" + (6 + i * 6) + 'px"></span>';
    b.setAttribute("aria-pressed", String(s === size));
    b.addEventListener("click", () => {
      size = s; fillMode = false; color = color === "erase" ? COLORS[0] : color;
      [...sz.children].forEach((el) => el.setAttribute("aria-pressed", el === b));
      syncSwatches();
    });
    sz.appendChild(b);
  });
  const eraser = document.createElement("button");
  eraser.type = "button"; eraser.textContent = "🧽";
  eraser.addEventListener("click", () => {
    color = "erase"; fillMode = false;
    [...sw.children].forEach((el) => el.setAttribute("aria-pressed", "false"));
    eraser.setAttribute("aria-pressed", "true");
    bucket.setAttribute("aria-pressed", "false");
  });
  sz.appendChild(eraser);
  const bucket = document.createElement("button");
  bucket.type = "button"; bucket.textContent = "🪣"; bucket.title = "Fill a whole zone";
  bucket.addEventListener("click", () => {
    fillMode = true;
    if (color === "erase") color = COLORS[0];
    [...sz.children].forEach((el) => el.setAttribute("aria-pressed", String(el === bucket)));
    [...sw.children].forEach((el, i) => el.setAttribute("aria-pressed", String(COLORS[i] === color)));
  });
  sz.appendChild(bucket);
  function syncSwatches() {
    eraser.setAttribute("aria-pressed", String(color === "erase"));
    bucket.setAttribute("aria-pressed", String(fillMode));
  }

  // Fit the stack to the line art's own aspect ratio inside the available box.
  // The server derives the fish silhouette from the SAME template, so keeping
  // the aspect exact is what makes the cut-out line up with the paint.
  function layout(iw, ih) {
    const bw = wrap.clientWidth - 12, bh = wrap.clientHeight - 12;
    const s = Math.min(bw / iw, bh / ih);
    stack.style.width = Math.floor(iw * s) + "px";
    stack.style.height = Math.floor(ih * s) + "px";
  }

  function startPaint(id, label, onReady) {
    chosen = id;
    dirty = false;
    $("pname").textContent = label;
    show("paint");
    art.src = "static/lineart/" + id + ".png";
    const img = new Image();
    img.onload = () => {
      const s = CANVAS_MAX / Math.max(img.width, img.height);
      paper.width = Math.round(img.width * Math.min(1, s));
      paper.height = Math.round(img.height * Math.min(1, s));
      ctx.clearRect(0, 0, paper.width, paper.height);
      ctx.lineCap = ctx.lineJoin = "round";
      history = []; $("undo").disabled = true;
      layout(img.width, img.height);
      window.__layout = () => layout(img.width, img.height);
      artImg = img;
      if (onReady) onReady();
    };
    img.src = "static/lineart/" + id + ".png";
  }
  window.addEventListener("resize", () => window.__layout && window.__layout());
  window.addEventListener("orientationchange", () => setTimeout(() => window.__layout && window.__layout(), 120));

  // pointer -> canvas coords (backing store may differ from CSS size)
  function at(e) {
    const r = paper.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) * (paper.width / r.width),
      y: (e.clientY - r.top) * (paper.height / r.height),
    };
  }
  function pushHistory() {
    try { history.push(ctx.getImageData(0, 0, paper.width, paper.height)); }
    catch (err) { return; }
    if (history.length > MAX_UNDO) history.shift();
    $("undo").disabled = false;
  }
  function strokeStyle() {
    if (color === "erase") {
      ctx.globalCompositeOperation = "destination-out";
      ctx.strokeStyle = "rgba(0,0,0,1)";
    } else {
      ctx.globalCompositeOperation = "source-over";
      ctx.strokeStyle = color;
    }
    ctx.lineWidth = size * (paper.width / (stack.clientWidth || paper.width));
  }

  // Fill the zone under the tap: every pixel reachable from it without crossing
  // the outline (or a different colour already painted). The zone then grows 2px
  // so it tucks under the line instead of leaving a white rim.
  function hexRgb(c) {
    const t = document.createElement("canvas").getContext("2d");
    t.fillStyle = c; const h = t.fillStyle;      // normalised to #rrggbb
    return [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  }
  function fillAt(pt) {
    const W = paper.width, H = paper.height;
    const x0 = Math.floor(pt.x), y0 = Math.floor(pt.y);
    if (!artImg || x0 < 0 || y0 < 0 || x0 >= W || y0 >= H) return false;
    const off = document.createElement("canvas"); off.width = W; off.height = H;
    const octx = off.getContext("2d"); octx.drawImage(artImg, 0, 0, W, H);
    const wall = octx.getImageData(0, 0, W, H).data;
    const img = ctx.getImageData(0, 0, W, H), px = img.data;
    const k0 = (y0 * W + x0) * 4;
    if (wall[k0 + 3] > 80) return false;          // tapped right on the line
    const r0 = px[k0], g0 = px[k0 + 1], b0 = px[k0 + 2], a0 = px[k0 + 3];
    const same = (k) => wall[k + 3] <= 80 &&
      Math.abs(px[k] - r0) + Math.abs(px[k + 1] - g0) + Math.abs(px[k + 2] - b0) + Math.abs(px[k + 3] - a0) < 90;
    const mask = new Uint8Array(W * H), stackXY = [x0, y0];
    while (stackXY.length) {
      const y = stackXY.pop(), x = stackXY.pop();
      let l = x; while (l > 0 && !mask[y * W + l - 1] && same((y * W + l - 1) * 4)) l--;
      let r = x; while (r < W - 1 && !mask[y * W + r + 1] && same((y * W + r + 1) * 4)) r++;
      for (let i = l; i <= r; i++) {
        mask[y * W + i] = 1;
        for (const ny of [y - 1, y + 1]) {
          if (ny < 0 || ny >= H) continue;
          const j = ny * W + i;
          if (!mask[j] && same(j * 4)) stackXY.push(i, ny);
        }
      }
    }
    const [cr, cg, cb] = hexRgb(color);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let hit = false;
      for (let dy = -2; dy <= 2 && !hit; dy++) for (let dx = -2; dx <= 2 && !hit; dx++) {
        const yy = y + dy, xx = x + dx;
        if (yy >= 0 && yy < H && xx >= 0 && xx < W && mask[yy * W + xx]) hit = true;
      }
      if (!hit) continue;
      const k = (y * W + x) * 4;
      px[k] = cr; px[k + 1] = cg; px[k + 2] = cb; px[k + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    return true;
  }

  stack.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    if (fillMode && color !== "erase") {
      pushHistory();
      if (fillAt(at(e))) { dirty = true; scheduleSave(); }
      else history.pop();
      $("undo").disabled = history.length === 0;
      return;
    }
    pushHistory();
    drawing = true; dirty = true; last = at(e);
    stack.setPointerCapture(e.pointerId);
    strokeStyle();
    // a tap alone should leave a dot
    ctx.beginPath();
    ctx.arc(last.x, last.y, ctx.lineWidth / 2, 0, Math.PI * 2);
    ctx.fillStyle = ctx.strokeStyle; ctx.fill();
  });
  stack.addEventListener("pointermove", (e) => {
    if (!drawing) return;
    e.preventDefault();
    const p = at(e);
    strokeStyle();
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p;
  });
  const endStroke = () => {
    if (!drawing) return;
    drawing = false; ctx.globalCompositeOperation = "source-over";
    scheduleSave();               // persist the in-progress drawing after each stroke
  };
  stack.addEventListener("pointerup", endStroke);
  stack.addEventListener("pointercancel", endStroke);
  stack.addEventListener("pointerleave", endStroke);

  $("undo").addEventListener("click", () => {
    const prev = history.pop();
    if (!prev) return;
    ctx.globalCompositeOperation = "source-over";
    ctx.putImageData(prev, 0, 0);
    $("undo").disabled = history.length === 0;
    scheduleSave();               // keep the cache in step with the undo
  });
  $("clear").addEventListener("click", () => {
    pushHistory();
    ctx.globalCompositeOperation = "source-over";
    ctx.clearRect(0, 0, paper.width, paper.height);
    clearDraft();                 // a wiped canvas has nothing worth restoring
  });
  $("fishName").addEventListener("input", () => { if (dirty) scheduleSave(); });
  $("back").addEventListener("click", () => show("pick"));

  // ---------------- submit ----------------
  $("go").addEventListener("click", async () => {
    const go = $("go");
    go.disabled = true; go.textContent = "Sending…";
    try {
      const flat = await flatten();
      const nm = ($("fishName").value || "").trim();
      const r = await fetch("api/draw?species=" + encodeURIComponent(chosen) +
                            (nm ? "&name=" + encodeURIComponent(nm) : ""),
                            { method: "POST", body: flat });
      const j = await r.json();
      show("done");
      if (j.ok) {
        $("dicon").textContent = "🐠";
        // j.name is set via textContent below -> no HTML injection from guest input
        const held = j.status === "needs_review";
        $("dtitle").textContent = (j.name ? j.name + " (" + j.display + ")" : j.display)
                                  + (held ? " is on its way!" : " is in the tank!");
        $("dmsg").textContent = held
          ? "Every new fish gets a quick look from the keeper first. Check the tank later today."
          : "It starts swimming within ~10 seconds.";
        $("fishName").value = "";                    // clear for the next fish
        clearDraft();                                // sent → cache done its job
        screens.done.classList.remove("err");
      } else {
        $("dicon").textContent = "❌";
        $("dtitle").textContent = "That didn't work";
        $("dmsg").textContent = j.error || "could not send";
        screens.done.classList.add("err");
      }
    } catch (e) {
      show("done");
      $("dicon").textContent = "❌";
      $("dtitle").textContent = "Network error";
      $("dmsg").textContent = String(e);
      screens.done.classList.add("err");
    }
    go.disabled = false; go.textContent = "Swim! 🐠";
  });

  // paint + line art flattened into one PNG. The server clips it to the
  // template's silhouette, so we just hand over the full rectangle.
  function flatten() {
    return new Promise((resolve, reject) => {
      const out = document.createElement("canvas");
      out.width = paper.width; out.height = paper.height;
      const g = out.getContext("2d");
      g.drawImage(paper, 0, 0);
      const line = new Image();
      line.onload = () => {
        g.drawImage(line, 0, 0, out.width, out.height);
        out.toBlob((b) => b ? resolve(b) : reject(new Error("toBlob failed")), "image/png");
      };
      line.onerror = () => reject(new Error("line art failed to load"));
      line.src = art.src;
    });
  }

  $("again").addEventListener("click", () => show("pick"));

  // ---------------- restore an unsent drawing on load ----------------
  // Re-open the saved species, then paint the cached pixels back once its
  // canvas has been sized (same species => identical backing-store dims, so
  // the drawImage maps 1:1). Keep `dirty` true so a further stroke re-saves.
  function restoreDraft(d) {
    const label = d.label || (SPECIES.find((s) => s[0] === d.species) || [])[1] || d.species;
    startPaint(d.species, label, () => {
      const im = new Image();
      im.onload = () => {
        ctx.globalCompositeOperation = "source-over";
        ctx.drawImage(im, 0, 0, paper.width, paper.height);
        dirty = true;
      };
      im.src = d.png;
    });
    $("fishName").value = d.name || "";
  }
  const bar = $("resumeBar"), draft = readDraft();
  if (draft) {
    bar.hidden = false;
    $("resumeYes").addEventListener("click", () => { bar.hidden = true; restoreDraft(draft); });
    $("resumeNo").addEventListener("click", () => { bar.hidden = true; clearDraft(); });
  }
})();
</script>
<script src="static/js/tanknav.js"></script>
<script src="static/js/sitechrome.js"></script>
</body>
