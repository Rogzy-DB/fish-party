<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add a fish — Fish Party</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    font: 16px/1.5 system-ui, sans-serif; color: #dfe9f5;
    background: linear-gradient(#06182e, #041020 70%, #020a14);
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 24px 16px 48px;
  }
  h1 { font-size: 1.35rem; margin: 8px 0 2px; }
  p.sub { color: #8fb0cc; font-size: .92rem; margin-bottom: 22px; text-align: center; }
  .card {
    width: 100%; max-width: 460px; background: #0a2038cc;
    border: 1px solid #1d3a5c; border-radius: 16px; padding: 20px;
  }
  label.drop {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    border: 2px dashed #2c567f; border-radius: 12px; padding: 34px 16px;
    cursor: pointer; text-align: center; color: #a9c6e2; transition: border-color .2s;
  }
  label.drop:hover { border-color: #4d8ec4; }
  label.drop .big { font-size: 2.2rem; }
  input[type=file] { display: none; }
  img#preview { max-width: 100%; max-height: 320px; border-radius: 10px; display: none; margin: 14px auto 0; }
  button {
    width: 100%; margin-top: 16px; padding: 13px; font-size: 1.05rem;
    border: 0; border-radius: 10px; background: #1573c4; color: white;
    cursor: pointer; font-weight: 600;
  }
  button:disabled { background: #29425c; color: #7d94ab; cursor: default; }
  #result { margin-top: 18px; display: none; border-radius: 12px; padding: 16px; text-align: center; }
  #result.ok { display: block; background: #0c3320; border: 1px solid #1e6b42; }
  #result.review { display: block; background: #33290c; border: 1px solid #6b5a1e; }
  #result.err { display: block; background: #33100c; border: 1px solid #6b2a1e; }
  #result .species { font-size: 1.4rem; font-weight: 700; margin: 6px 0; }
  #result .conf { color: #9db8d2; font-size: .88rem; }
  a.nav { color: #6fb1e8; font-size: .9rem; margin-top: 26px; }
  .templates { width: 100%; max-width: 460px; margin-top: 30px; }
  .templates h2 { font-size: 1rem; font-weight: 600; color: #cfe0f0; margin-bottom: 4px; }
  .templates p { color: #7f9db8; font-size: .82rem; margin-bottom: 14px; }
  .tgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .tgrid a {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    text-decoration: none; color: #9db8d2; font-size: .68rem;
  }
  .tgrid a img {
    width: 100%; aspect-ratio: 1; object-fit: contain; background: #fff;
    border-radius: 8px; padding: 5px; transition: transform .12s;
  }
  .tgrid a:hover img { transform: scale(1.06); }
</style>
<script>
  // home = your own party (everything open) · public = the shared tank (owner
  // pages behind a password) · showcase = read-only. serve.py fills this in.
  window.TANK_MODE = "TANK_MODE_PLACEHOLDER";
  document.documentElement.dataset.mode = window.TANK_MODE;
</script>
<style>
  [data-mode="public"] .owner-only, [data-mode="showcase"] .owner-only,
  [data-mode="showcase"] .guest-only, [data-mode="home"] .site-only { display: none !important; }
</style>
</head>
<body>
  <h1>🐟 Add a fish</h1>
  <div style="width:100%;max-width:460px"><nav id="tanknav"></nav></div>
  <p class="sub">Photograph the colored sheet — outline fully in frame,<br>on a light background.</p>

  <div class="card">
    <label class="drop" id="drop">
      <span class="big">📷</span>
      <span id="dropText">Tap to photograph or choose an image</span>
      <input type="file" id="file" accept="image/*" capture="environment">
    </label>
    <img id="preview" alt="">
    <button id="send" disabled>Send to the aquarium</button>
    <div id="result"></div>
  </div>

  <section class="templates">
    <h2>Need a sheet to colour?</h2>
    <p>Download &amp; print a blank outline, colour it in, then photograph it above.</p>
    <div class="tgrid" id="tgrid"></div>
  </section>

  <a class="nav owner-only" href="review">→ review tray</a>
  <a class="nav" href="./">→ watch the tank</a>

<script>
(() => {
  // the 12 blank templates (ids match recognizer/references/*.png)
  const TEMPLATES = [
    ["shark", "Shark"], ["whale", "Whale"], ["turtle", "Turtle"],
    ["manta_ray", "Manta ray"], ["angelfish", "Angelfish"], ["pufferfish", "Pufferfish"],
    ["jellyfish", "Jellyfish"], ["octopus", "Octopus"], ["squid", "Squid"],
    ["seahorse", "Seahorse"], ["crab", "Crab"], ["sea_urchin", "Sea urchin"],
  ];
  const grid = document.getElementById("tgrid");
  for (const [id, label] of TEMPLATES) {
    const a = document.createElement("a");
    a.href = "templates/" + id + ".png";
    a.download = id + ".png";
    a.innerHTML = '<img loading="lazy" src="templates/' + id + '.png" alt="' +
      label + '"><span>' + label + '</span>';
    grid.appendChild(a);
  }

  const fileIn = document.getElementById("file");
  const preview = document.getElementById("preview");
  const send = document.getElementById("send");
  const result = document.getElementById("result");
  const dropText = document.getElementById("dropText");
  let blob = null;

  fileIn.addEventListener("change", () => {
    blob = fileIn.files[0] || null;
    result.className = ""; result.style.display = "none";
    if (!blob) { send.disabled = true; preview.style.display = "none"; return; }
    preview.src = URL.createObjectURL(blob);
    preview.style.display = "block";
    dropText.textContent = blob.name || "photo selected";
    send.disabled = false;
  });

  send.addEventListener("click", async () => {
    if (!blob) return;
    send.disabled = true; send.textContent = "Recognizing…";
    try {
      // raw bytes, no multipart: the server reads the body directly
      const r = await fetch("api/upload", { method: "POST", body: blob });
      const j = await r.json();
      if (j.ok && j.status === "ok") {
        result.className = "ok";
        result.innerHTML = `<div>✅ recognized!</div>
          <div class="species">${j.display}</div>
          <div class="conf">confidence ${(j.confidence * 100).toFixed(0)}%${j.rotation ? " · auto-righted ↻" + j.rotation + "°" : ""}</div>
          <div style="margin-top:8px">It's swimming within ~10 seconds 🐠</div>`;
      } else if (j.ok && window.TANK_MODE === "public") {
        result.className = "ok";
        result.innerHTML = `<div>✅ got it, thank you!</div>
          <div style="margin-top:8px">Every new fish gets a quick look from the keeper first. Check the tank later today 🐠</div>`;
      } else if (j.ok) {
        result.className = "review";
        result.innerHTML = `<div>🔎 not sure enough — sent to the review tray</div>
          <div class="conf">closest guess: ${j.best_guess_display || "?"} (${(j.confidence * 100).toFixed(0)}%)</div>
          <div style="margin-top:8px"><a href="review" style="color:#e8c76f">open the review tray →</a></div>`;
      } else {
        result.className = "err";
        result.textContent = "❌ " + (j.error || "upload failed");
      }
    } catch (e) {
      result.className = "err";
      result.textContent = "❌ network error: " + e;
    }
    send.textContent = "Send to the aquarium";
    send.disabled = false;
  });
})();
</script>
<script src="static/js/tanknav.js"></script>
</body>
</html>
